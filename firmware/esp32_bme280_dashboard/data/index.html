<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>ESP32 Home Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>ESP32 Home Dashboard</h1>
        <div class="meta">Live BME280 data from your sensors</div>
      </div>
      <div style="display:grid;gap:10px;justify-items:end">
        <div class="actions">
          <a class="btn primary" href="/measure">Measure now</a>
          <a class="btn ghost" href="/refresh">Refresh</a>
        </div>
      </div>
    </div>

    <div id="rooms"></div>
  </div>

  <template id="room-template">
    <div class="room">
      <div class="room-head">
        <h2 class="room-name"></h2>
        <div class="wifi room-wifi">Status: ...</div>
      </div>

      <div class="grid">
        <div class="card">
          <div class="label">⬤ Temperature</div>
          <div class="gauge">
            <div class="needle needle-temp"></div>
            <div class="center"></div>
          </div>
          <div class="value value-temp">-- °C</div>
        </div>

        <div class="card">
          <div class="label">⬤ Humidity</div>
          <div class="gauge">
            <div class="needle needle-humid"></div>
            <div class="center"></div>
          </div>
          <div class="value value-humid">-- %</div>
        </div>

        <div class="card">
          <div class="label">⬤ Pressure</div>
          <div class="gauge">
            <div class="needle needle-press"></div>
            <div class="center"></div>
          </div>
          <div class="value value-press">-- kPa</div>
        </div>
      </div>

      <div class="summary">Comfort: <span class="room-comfort">N/A</span></div>
      <div class="meta">Trend: <span class="room-trend trend flat">→ steady</span></div>
      <div class="meta">Last measurement: <span class="room-lastMeasurement">N/A</span></div>

      <div class="status">
        <div class="pill">Last upload: <span class="room-lastUpload">never</span></div>
        <div class="pill">Next upload in: <span class="room-nextUpload">...</span></div>
      </div>

      <div class="stats">
        <div class="pill room-tempStats">Temp min/max: -- / --</div>
        <div class="pill room-humidStats">Humidity min/max: -- / --</div>
        <div class="pill room-pressStats">Pressure min/max: -- / --</div>
      </div>
    </div>
  </template>

  <script src="/app.js"></script>
</body>
</html>

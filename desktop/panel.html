<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ESP32 Widget</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body class="collapsed" data-edge="right">

  <div id="bubble" class="bubble">
    <div class="bubble-glow">
      <div class="bubble-dot"></div>
    </div>
  </div>

  <div id="panel" class="panel">
    <div class="panel-header">
      <button id="settingsBtn" class="icon-btn" title="Settings">⚙</button>
      <button id="collapseBtn" class="icon-btn" title="Hide">»</button>
      <button id="quitBtn" class="icon-btn quit" title="Quit">✕</button>
    </div>

    <div id="dashboardView" class="view">
      <button id="measureNowBtn" class="measure-btn">Measure now</button>

      <div id="rooms" class="rooms"></div>

      <div class="status-line" id="statusLine">Connecting...</div>
    </div>

    <template id="room-template">
      <div class="room">
        <div class="room-name"></div>

        <div class="gauge-card">
          <div class="label">Temperature</div>
          <div class="gauge">
            <div class="needle needle-temp"></div>
            <div class="center"></div>
          </div>
          <div class="value value-temp">-- °C</div>
        </div>

        <div class="gauge-card">
          <div class="label">Humidity</div>
          <div class="gauge">
            <div class="needle needle-humid"></div>
            <div class="center"></div>
          </div>
          <div class="value value-humid">-- %</div>
        </div>

        <div class="gauge-card">
          <div class="label">Pressure</div>
          <div class="gauge">
            <div class="needle needle-press"></div>
            <div class="center"></div>
          </div>
          <div class="value value-press">-- kPa</div>
        </div>

        <div class="extra-info">
          <div class="pill pill-comfort"></div>
          <div class="pill pill-trend"></div>
          <div class="pill pill-wifi"></div>
          <div class="pill pill-lastUpload"></div>
        </div>
      </div>
    </template>

    <div id="settingsView" class="view hidden">
      <h2>Settings</h2>

      <label for="address">ESP32 address</label>
      <input id="address" type="text" placeholder="esp32-home.local or 192.168.1.50" />

      <label>Screen edge</label>
      <div class="radio-row">
        <label><input type="radio" name="edge" value="left" /> Left</label>
        <label><input type="radio" name="edge" value="right" /> Right</label>
      </div>

      <label for="autoHideDelay">Auto-hide delay (seconds)</label>
      <input id="autoHideDelay" type="number" min="1" max="60" />

      <label>Extra info blocks</label>
      <div class="checkbox-row">
        <label><input type="checkbox" id="widgetComfort" /> Comfort</label>
        <label><input type="checkbox" id="widgetTrend" /> Trend</label>
        <label><input type="checkbox" id="widgetWifi" /> Wi-Fi status</label>
        <label><input type="checkbox" id="widgetLastUpload" /> Last upload</label>
      </div>

      <button id="saveSettingsBtn" class="save-btn">Save</button>
      <button id="backBtn" class="back-btn">Back</button>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
